/* Print modes: #print-summary (sections 1-7) and #print-annex (section 8 only). Saved edits (snapshots) carry the data version (state.dataVersion); an edit made on another version is not shown over the current data, but stays in the file and can be shown from the notice bar. Optional arrays (filled reports): rows + keywords (table), competitors (title + observation / assessment / sources [{url,label,date}] / approval, or title + text) with competitorintro, steps (action + fields [{label,text}], or basis / question / hypothesis), annexextra [{title,text}], proofs, sourceLinks; any text field may be an array of paragraphs. Links: http(s) only. Without them the template renders its placeholders. */
const state=JSON.parse(document.getElementById('report-data').textContent);let active=state.active;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const edit=(s,tag='p')=>Array.isArray(s)?s.map(x=>edit(x,tag)).join(''):`<${tag} class="edit" contenteditable="true">${esc(s)}</${tag}>`;
const link=l=>/^https?:\/\//.test(l.url)?`<li><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label||l.url)}</a>${l.date?' · '+esc(l.date):''}</li>`:'';
const links=ls=>ls&&ls.length?'<ul class="links">'+ls.map(link).join('')+'</ul>':'';
const dl=(labels,values)=>'<dl>'+labels.map((s,i)=>'<dt>'+esc(s)+'</dt>'+(Array.isArray(values[i])?'<dd class="multi">'+edit(values[i])+'</dd>':edit(values[i],'dd'))).join('')+'</dl>';
function section(n,title,body,cls=''){return `<section class="section ${cls}"><div class="eyebrow">${String(n).padStart(2,'0')} / ORTSRANK</div><h2>${esc(title)}</h2>${body}</section>`}
function render(lang){const t=state.translations[lang];let html=`<section class="hero"><div class="tag">${t.kicker}</div><h1>${t.title}</h1>${edit(t.sub)}<div class="meta">${t.meta.map((s,i)=>`<div><small>${s}</small>${edit(t.values[i],'span')}</div>`).join('')}</div></section><div class="notice">${t.notice}</div>`;
html+=section(1,t.sections[0],'<div class="grid'+(t.cards.length===4?' four':'')+'">'+t.cards.map((s,i)=>`<article class="card ${i===0?'accent':''}"><span class="pill ${['green','gray','amber','gray'][i%4]}">${s}</span>${edit(t.cardtitles[i],'h3')}${edit(t.cardtexts[i])}</article>`).join('')+'</div>');
html+=section(2,t.sections[1],'<div class="card">'+dl(t.scope,t.scopetext)+'</div>');
const kws=t.keywords||[1,2,3,4].map(n=>'[Keyword '+n+']');
const rowsData=t.rows||Array.from({length:5},(_,i)=>({city:'['+t.city+' '+String.fromCharCode(65+i)+']',cells:kws.map(()=>({counts:t.counts,cell:t.cell,evidence:t.evidence}))}));
const rows=rowsData.map(r=>'<tr><td>'+edit(r.city,'strong')+'</td>'+r.cells.map(c=>'<td>'+edit(c.counts,'strong')+edit(c.cell,'small')+edit(c.evidence,'small')+'</td>').join('')+'</tr>').join('');
html+=section(3,t.sections[2],'<p>'+t.tableintro+'</p><div class="tablewrap"><table><thead><tr><th>'+t.city+'</th>'+kws.map(k=>'<th contenteditable="true"'+(t.keywordsLang?' lang="'+esc(t.keywordsLang)+'"':'')+'>'+esc(k)+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div><p class="hint">'+t.notfound+'</p>');
const crit=t.criteriatext&&t.criteriatext.length;html+=section(4,t.sections[3],`<div class="${crit?'twocol':''}"><article class="card"><span class="pill gray">${t.rulelabel}</span>${edit(t.ruletitle,'h3')}${edit(t.ruletext)}<p class="callout">${t.rulewarning}</p></article>${crit?`<article class="card question"><span class="tag">${t.criteria}</span>${edit(t.criteriatext)}</article>`:''}</div>`);
const comps=t.competitors||[{title:t.competitortitle,text:t.competitortext}];
html+=section(5,t.sections[4],`${t.competitorintro?edit(t.competitorintro):''}<div class="twocol"><article class="card"><span class="pill amber">Local Pack</span>${edit(t.localtitle,'h3')}${edit(t.localtext)}<p>${t.localwarning}</p></article><div class="stack">${comps.map(c=>`<article class="card"><span class="pill gray">${t.competitor}</span>${edit(c.title,'h3')}${c.observation?`<strong>${esc(t.complabels[0])}</strong>${edit(c.observation)}<strong>${esc(t.complabels[1])}</strong>${edit(c.assessment)}<strong>${esc(t.complabels[2])}</strong>${links(c.sources)}${t.sourcesinannex?'<p class="hint onlyprint">'+esc(t.sourcesinannex)+'</p>':''}${edit(c.approval)}`:edit(c.text)}</article>`).join('')}</div></div>`,'s-local');
const steps=t.steps||[{action:t.action,basis:t.basistext,question:t.questiontext,hypothesis:t.hypothesistext}];
html+=section(6,t.sections[5],`<p>${t.recommendintro}</p>`+steps.map((s,i)=>`<article class="card step"><div class="stepnum">${String(i+1).padStart(2,'0')}</div><div><span class="pill">${t.human}</span>${edit(s.action,'h3')}${s.fields?s.fields.map(f=>'<strong>'+esc(f.label)+'</strong>'+edit(f.text)).join(''):`<strong>${t.basis}</strong>${edit(s.basis)}<strong>${t.question}</strong>${edit(s.question)}<strong>${t.hypothesis}</strong>${edit(s.hypothesis)}`}</div></article>`).join(''));
html+=section(7,t.sections[6],`<div class="card">${edit(t.open)}<p>${t.promise}</p></div>`);
const proofs=t.proofs||[t.proofvalues];
html+=section(8,t.sections[7],`${t.annexnote?'<p class="annexnote">'+esc(t.annexnote)+'</p>':''}<details><summary>${t.details[0]}</summary>${proofs.map(v=>dl(t.prooflabels,v)).join('<hr>')}</details><details><summary>${t.details[1]}</summary>${edit(t.source)}${links(t.sourceLinks)}<p>${t.identity}</p></details><details><summary>${t.details[2]}</summary>${dl(t.costlabels,t.costvalues)}</details>${(t.annexextra||[]).map(x=>'<details><summary>'+esc(x.title)+'</summary>'+edit(x.text)+'</details>').join('')}`,'annex');
html+=`<footer class="foot"><span><strong>ortsrank.</strong> ${t.tagline}</span><span>${t.footer}</span></footer>`;return html}
const ver=()=>state.dataVersion||null;
const snapOf=l=>{const x=(state.snapshots||{})[l];return x==null?null:typeof x==='string'?{v:null,html:x}:x};
const dirty={},viewing={};
function capture(){const el=document.getElementById('report'),x=snapOf(active);state.snapshots=state.snapshots||{};if(x&&viewing[active]==='old'){state.snapshots[active]={v:x.v,html:el.innerHTML};return}if(!dirty[active])return;if(x&&x.v!==ver()){state.archived=state.archived||{};state.archived[active]=x}state.snapshots[active]={v:ver(),html:el.innerHTML};dirty[active]=false}
function changeLanguage(lang){capture();active=lang;show()}
function show(){const mode=location.hash.replace('#','');document.body.classList.toggle('print-summary',mode==='print-summary');document.body.classList.toggle('print-annex',mode==='print-annex');const t=state.translations[active];document.documentElement.lang=active;document.title='Ortsrank · '+t.template;document.getElementById('language').value=active;document.getElementById('print').textContent=t.print;document.getElementById('save').textContent=t.save;const x=snapOf(active),stale=!!(x&&x.v!==ver()),old=stale&&viewing[active]==='old',bar=document.getElementById('stale');document.getElementById('report').innerHTML=x&&(!stale||old)?x.html:render(active);if(!stale)viewing[active]='new';if(bar){bar.hidden=!stale;bar.innerHTML=stale?esc(t.stalesnap||'')+' <button type="button" class="btn">'+esc((old?t.shownew:t.showold)||'')+'</button>':'';if(stale)bar.querySelector('button').onclick=()=>{capture();viewing[active]=old?'new':'old';show()}}}
function printReport(){document.querySelectorAll('details').forEach(d=>{d.dataset.previous=d.open?'1':'0';d.open=true});window.print()}
window.addEventListener('afterprint',()=>document.querySelectorAll('details').forEach(d=>d.open=d.dataset.previous==='1'));
document.getElementById('report').addEventListener('input',()=>{dirty[active]=true});
function saveCopy(){capture();state.active=active;const clone=document.documentElement.cloneNode(true);clone.querySelector('#report-data').textContent=JSON.stringify(state).replace(/</g,'\\u003c');const blob=new Blob(['<!doctype html>'+clone.outerHTML],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Ortsrank-Report-'+active+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
show();
</script></body></html>
